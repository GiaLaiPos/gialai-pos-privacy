<p><strong>如何刪除帳號？</strong> 設定 → 帳號與安全性 → 刪除我的帳號。</p>
<p><strong>網路不穩可以收銀嗎？</strong> 可以，離線時會先記錄，恢復網路後自動補傳。</p>
